<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siji — Pangeling</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #faf9f6; color: #1a1a1a; }
  header { background: #0f766e; color: #fff; padding: 1.5rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: .25rem 0 0; opacity: .85; font-size: .9rem; }
  main { max-width: 720px; margin: 0 auto; padding: 1.5rem; }
  .search { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .search input { flex: 1; padding: .75rem 1rem; border: 1px solid #d6d3cb; border-radius: 10px; font-size: 1rem; }
  .search button { padding: .75rem 1.5rem; background: #0f766e; color: #fff; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; }
  .card { background: #fff; border: 1px solid #e5e2da; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  .card h3 { margin: 0 0 .5rem; color: #0f766e; }
  .card .isi { line-height: 1.7; }
  .meta { margin-top: .75rem; font-size: .85rem; color: #777; }
  .tag { display: inline-block; background: #ecfdf5; color: #0f766e; border-radius: 99px; padding: .1rem .6rem; font-size: .75rem; margin-right: .25rem; }
  .kosong { text-align: center; color: #999; padding: 2rem 0; }
</style>
</head>
<body>
<header>
  <h1>☾ Siji</h1>
  <p>Tafsir · Hadits · Siroh — pangeling.web.id</p>
</header>
<main>
  <div class="search">
    <input id="q" type="search" placeholder="Cari ayat, hadits, tema… (mis. iman)" autofocus>
    <button onclick="cari()">Cari</button>
  </div>
  <div id="hasil"><div class="kosong">Memuat konten…</div></div>
</main>
<script>
async function muatSemua() {
  const r = await fetch('/api/konten');
  const d = await r.json();
  tampil(d, 'Semua Konten');
}
async function cari() {
  const q = document.getElementById('q').value.trim();
  if (!q) return muatSemua();
  const r = await fetch('/api/cari?q=' + encodeURIComponent(q));
  const d = await r.json();
  tampil(d, `Hasil pencarian: "${q}"`);
}
function tampil(list, judul) {
  const el = document.getElementById('hasil');
  if (!list.length) { el.innerHTML = '<div class="kosong">Tidak ditemukan.</div>'; return; }
  el.innerHTML = `<h2 style="font-size:1.1rem">${judul}</h2>` + list.map(k => `
    <div class="card">
      <h3>${esc(k.judul)}</h3>
      <div class="isi">${esc(k.isi)}</div>
      <div class="meta">
        ${k.sumber ? '📜 ' + esc(k.sumber) + ' · ' : ''}
        <span class="tag">${esc(k.jenis)}</span>
        ${k.tag ? k.tag.split(',').map(t => `<span class="tag">${esc(t.trim())}</span>`).join('') : ''}
      </div>
    </div>`).join('');
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') cari(); });
muatSemua();
</script>
</body>
</html>
